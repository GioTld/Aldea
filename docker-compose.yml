version: '3.8'

services:
  tracker:
    build: .
    command: ["trackerd", "-config", "/etc/aldea/tracker.yaml"]
    ports:
      - "8080:8080"
    volumes:
      - tracker-data:/data
      - ./deploy/docker/tracker.yaml:/etc/aldea/tracker.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nodes"]
      interval: 2s
      timeout: 2s
      retries: 5

  node1:
    build: .
    command: ["noded", "-config", "/etc/aldea/node.yaml"]
    depends_on:
      tracker:
        condition: service_healthy
    volumes:
      - node1-data:/data
      - ./deploy/docker/node1.yaml:/etc/aldea/node.yaml:ro

  node2:
    build: .
    command: ["noded", "-config", "/etc/aldea/node.yaml"]
    depends_on:
      tracker:
        condition: service_healthy
    volumes:
      - node2-data:/data
      - ./deploy/docker/node2.yaml:/etc/aldea/node.yaml:ro

  node3:
    build: .
